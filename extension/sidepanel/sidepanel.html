<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>penny</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Seasonal mesh background: three slowly drifting blurred blobs whose
       colors follow the deadline date's season (theme.js, sidepanel.css). -->
  <div class="mesh" aria-hidden="true">
    <span class="mesh-blob mesh-blob--1"></span>
    <span class="mesh-blob mesh-blob--2"></span>
    <span class="mesh-blob mesh-blob--3"></span>
  </div>

  <!-- Top to bottom: product line, verdict card with the coin, chance line,
       sliders card, one context button, chips + "why?", details (price
       range and watch list), dev tools. All text is lowercase (CSS). -->
  <div class="panel">
    <main class="panel-main">
      <!-- 1. The product on the active tab, kept small. -->
      <p class="product-line" id="product-summary" aria-label="detected product" hidden>
        <span class="product-line-title" id="product-title"></span>
        <span class="product-line-separator" aria-hidden="true"> · </span>
        <span class="product-line-price" id="product-price"></span>
      </p>

      <!-- Exactly one of the three views below is visible at a time (render.js). -->
      <section class="status-view status-view--loading glass" id="loading-view" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p class="status-view-text" id="loading-text">loading…</p>
      </section>

      <section class="status-view glass" id="message-view" aria-live="polite" hidden>
        <h2 class="status-view-title" id="message-title"></h2>
        <p class="status-view-text" id="message-text"></p>
        <button class="link-button status-view-retry" id="message-retry" type="button" hidden>try again</button>
      </section>

      <article class="recommendation-card" id="recommendation-card" hidden>
        <!-- 1. Verdict card: the verdict with "why?" beside it, the coin, the
             predicted lowest price, and (when opened) the explanation.
             Hovering the card tosses the coin; clicking the coin 5 times
             leaves Demo mode. -->
        <section class="verdict-card glass" aria-label="recommendation">
          <div class="verdict-head">
            <h2 class="verdict" id="verdict"></h2>
            <button class="why-toggle" id="why-toggle" type="button" aria-expanded="false" aria-controls="why-panel">why?</button>
          </div>
          <div class="coin-stage" id="coin" title="penny">
            <span class="coin-shadow" aria-hidden="true"></span>
            <div class="coin" aria-hidden="true">
              <span class="coin-rim coin-rim--1"></span>
              <span class="coin-rim coin-rim--2"></span>
              <span class="coin-rim coin-rim--3"></span>
              <span class="coin-rim coin-rim--4"></span>
              <span class="coin-rim coin-rim--5"></span>
              <span class="coin-face coin-face--back"><span class="coin-letter">p</span></span>
              <span class="coin-face coin-face--front"><span class="coin-letter">p</span></span>
            </div>
          </div>
          <p class="predicted-low-line" id="predicted-low-line"></p>

          <!-- "why?": the backend's own explanation, then the forecast's own
               reliability (its confidence field). -->
          <section class="why-panel" id="why-panel" aria-label="why this recommendation" hidden>
            <p class="why-panel-explanation" id="explanation"></p>
            <dl class="why-panel-facts">
              <div class="why-panel-fact" id="expected-savings-row">
                <dt class="why-panel-fact-label">typical drop, when it drops</dt>
                <dd class="why-panel-fact-value" id="expected-savings"></dd>
              </div>
            </dl>
            <p class="why-panel-reliability" id="forecast-reliability"></p>
          </section>
        </section>

        <!-- 2. What the estimate is based on when it isn't all real price
             history, or real history loading (render.js). -->
        <p class="history-notice" id="history-notice" aria-live="polite" hidden>
          <span class="history-notice-spinner" aria-hidden="true"></span>
          <span id="history-notice-text"></span>
        </p>

        <!-- 3. Chance line (render.js), plus a "couldn't update" line. -->
        <div class="chance-plate">
          <span class="updating-indicator" id="updating-indicator" role="status"></span>
          <p class="chance-line" id="recommendation-result"></p>
        </div>
        <p class="recommendation-status" id="recommendation-status" aria-live="polite" hidden></p>

        <!-- 4. Sliders (sliders.js). Moving them re-requests the forecast. -->
        <section class="sliders-card glass" aria-label="your goals">
          <div class="slider-control slider-control--deadline" id="deadline-control">
            <div class="slider-control-header">
              <label class="slider-control-label" for="deadline-slider">when do you want it by?</label>
              <output class="slider-tag" id="deadline-value" for="deadline-slider"></output>
            </div>
            <input class="slider slider--deadline" id="deadline-slider" type="range" min="1" max="90" step="1">
            <!-- Positioned at their real day on the 1–90 track (sidepanel.css). -->
            <div class="slider-ticks slider-ticks--deadline" aria-hidden="true">
              <span class="slider-tick">1 day</span>
              <span class="slider-tick">2 wks</span>
              <span class="slider-tick">1 mo</span>
              <span class="slider-tick">2 mo</span>
              <span class="slider-tick">3 mo</span>
            </div>
          </div>

          <div class="slider-control slider-control--savings" id="savings-control">
            <div class="slider-control-header">
              <label class="slider-control-label" for="savings-slider">how much do you want to save?</label>
              <output class="slider-tag" id="savings-value" for="savings-slider"></output>
            </div>
            <input class="slider slider--savings" id="savings-slider" type="range" min="1" max="30" step="1">
            <div class="slider-ticks slider-ticks--savings" aria-hidden="true">
              <span class="slider-tick">1%</span>
              <span class="slider-tick">30%</span>
            </div>
          </div>

          <!-- min_confidence_pct; the schema only accepts 50–95 (sliders.js). -->
          <div class="slider-control slider-control--confidence" id="confidence-control">
            <div class="slider-control-header">
              <label class="slider-control-label" for="confidence-slider">how sure do you want to be?</label>
              <output class="slider-tag" id="confidence-value" for="confidence-slider"></output>
            </div>
            <input class="slider slider--confidence" id="confidence-slider" type="range" min="50" max="95" step="1">
            <div class="slider-range-row" aria-hidden="true">
              <span class="slider-range-end" id="confidence-min-tick"></span>
              <span class="slider-range-end" id="confidence-max-tick"></span>
            </div>
          </div>
        </section>

        <!-- 5. One button that depends on the verdict (watchlist-ui.js):
             "wait & watch" / "watching", or "buy now at $X" (closes the panel). -->
        <button class="primary-button" id="primary-button" type="button"></button>

        <!-- 6. "add to google calendar: we'll tell you if it drops …" -->
        <div class="watch-confirmation-block" id="watch-confirmation-block" hidden>
          <p class="watch-confirmation" id="watch-confirmation" aria-live="polite"></p>
        </div>
      </article>

      <!-- Watched items, opened from either "see watched items" link
           (watchlist-ui.js). Each item has its target, deadline and remove. -->
      <section class="watchlist glass" id="watchlist" aria-labelledby="watchlist-title" hidden>
        <div class="watchlist-header">
          <h3 class="watchlist-title" id="watchlist-title">watched items</h3>
          <button class="link-button" id="watchlist-close" type="button">close</button>
        </div>
        <ul class="watchlist-items" id="watchlist-items"></ul>
        <p class="watchlist-empty" id="watchlist-empty" hidden>nothing watched yet. use "wait &amp; watch" on a product to add it here.</p>
      </section>
    </main>

    <template id="watchlist-item-template">
      <li class="watchlist-item">
        <div class="watchlist-item-info">
          <a class="watchlist-item-title" target="_blank" rel="noopener"></a>
          <p class="watchlist-item-target"></p>
          <p class="watchlist-item-status" hidden></p>
        </div>
        <button class="watchlist-item-remove link-button" type="button">remove</button>
      </li>
    </template>

    <!-- Bottom of the panel: dev tools, then the brand mark. -->
    <footer class="panel-footer">
      <!-- 8. Dev tools: unpacked installs only, collapsed by default, and hidden
           entirely in Demo mode (see sidepanel.js). -->
      <details class="dev-panel glass" id="dev-panel" hidden>
        <summary class="dev-panel-summary">dev tools</summary>
        <label class="dev-panel-toggle">
          <input type="checkbox" id="dev-demo-mode">
          <span>demo mode: hide dev tools</span>
        </label>
        <p class="dev-panel-hint">to show them again, press alt+shift+d in the panel or click the coin 5 times.</p>
        <label class="dev-panel-field">
          <span class="dev-panel-label">product</span>
          <select class="dev-panel-select" id="dev-detection">
            <option value="live">live: ask the current tab</option>
            <option value="ok">mock: product found</option>
            <option value="price_not_found">mock: price not found</option>
            <option value="unavailable">mock: item unavailable</option>
            <option value="not_product_page">mock: not a product page</option>
            <option value="no_content_script">mock: unsupported site</option>
            <option value="error">mock: detection error</option>
          </select>
        </label>
        <label class="dev-panel-field">
          <span class="dev-panel-label">data source</span>
          <select class="dev-panel-select" id="dev-source">
            <option value="backend">backend (post /predict)</option>
            <option value="mock">mock (file below)</option>
          </select>
        </label>
        <label class="dev-panel-field">
          <span class="dev-panel-label">mock file</span>
          <select class="dev-panel-select" id="dev-prediction">
            <option value="predict.json">predict.json</option>
            <option value="predict_wait.json">predict_wait.json</option>
            <option value="predict_buy_now.json">predict_buy_now.json</option>
            <option value="predict_low_confidence.json">predict_low_confidence.json</option>
            <option value="predict_not_enough_data.json">predict_not_enough_data.json</option>
            <option value="predict_fetching.json">predict_fetching.json (stays fetching)</option>
            <option value="predict_unavailable.json">predict_unavailable.json (no real history)</option>
            <option value="__fetching_then_ready">fetching, then real history on retry</option>
            <option value="__loading">never finishes (loading)</option>
            <option value="__error">request fails (error)</option>
          </select>
        </label>
        <div class="dev-panel-group">
          <label class="dev-panel-field">
            <span class="dev-panel-label">watched item</span>
            <select class="dev-panel-select" id="dev-watch"></select>
          </label>
          <div class="dev-panel-buttons">
            <button class="dev-panel-button" id="dev-simulate-drop" type="button">simulate price drop</button>
            <button class="dev-panel-button" id="dev-simulate-deadline" type="button">simulate deadline approaching</button>
          </div>
          <p class="dev-panel-status" id="dev-simulate-status" aria-live="polite"></p>
        </div>
      </details>

      <!-- Always there, so the watched list is reachable from any page. -->
      <p class="panel-footer-links">
        <button class="link-button" id="see-watched-from-footer" type="button" aria-controls="watchlist">see watched items</button>
      </p>

      <!-- 9. Brand mark: one bronze circle per letter. Screen readers get
           just "penny"; the letters' case is set in one rule (.brand-mark). -->
      <p class="brand-mark" role="img" aria-label="penny">
        <span class="brand-mark-key" aria-hidden="true">p</span>
        <span class="brand-mark-key" aria-hidden="true">e</span>
        <span class="brand-mark-key" aria-hidden="true">n</span>
        <span class="brand-mark-key" aria-hidden="true">n</span>
        <span class="brand-mark-key" aria-hidden="true">y</span>
      </p>
    </footer>
  </div>

  <!-- MV3 blocks inline scripts. Order matters: each file may use the ones above it. -->
  <script src="../shared/config.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/dates.js"></script>
  <script src="../shared/watchlist.js"></script>
  <script src="api.js"></script>
  <script src="render.js"></script>
  <script src="theme.js"></script>
  <script src="sliders.js"></script>
  <script src="watchlist-ui.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
