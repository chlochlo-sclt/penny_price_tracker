<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>[placeholder]</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h1 class="popup-title">[placeholder]</h1>
  </header>

  <main class="popup-main">
    <!-- The detected product. Shown above every state that has a product. -->
    <section class="product-summary" id="product-summary" aria-label="Detected product" hidden>
      <p class="product-summary-title" id="product-title"></p>
      <p class="product-summary-price" id="product-price"></p>
    </section>

    <!-- Exactly one of the three views below is visible at a time (render.js). -->
    <section class="status-view status-view--loading" id="loading-view" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p class="status-view-text" id="loading-text">Loading…</p>
    </section>

    <section class="status-view" id="message-view" aria-live="polite" hidden>
      <h2 class="status-view-title" id="message-title"></h2>
      <p class="status-view-text" id="message-text"></p>
    </section>

    <article class="recommendation-card" id="recommendation-card" hidden>
      <p class="recommendation-notice" id="low-confidence-notice" hidden>
        Not enough price history for a confident call yet.
      </p>
      <h2 class="recommendation-verdict" id="verdict"></h2>

      <!-- Goal sliders (sliders.js). Moving them re-requests the forecast. -->
      <section class="preference-controls" aria-label="Your goals">
        <div class="preference-control">
          <div class="preference-control-header">
            <label class="preference-control-label" for="savings-slider">How much do you want to save?</label>
            <output class="preference-control-value" id="savings-value" for="savings-slider"></output>
          </div>
          <input class="preference-slider" id="savings-slider" type="range" min="0" max="30" step="1">
        </div>

        <div class="preference-control">
          <div class="preference-control-header">
            <label class="preference-control-label" for="deadline-slider">When do you need it by?</label>
            <output class="preference-control-value" id="deadline-value" for="deadline-slider"></output>
          </div>
          <div class="deadline-slider">
            <span class="deadline-slider-marker" id="black-friday-marker" hidden>Black Friday</span>
            <input class="preference-slider" id="deadline-slider" type="range" min="0" max="5" step="1">
            <div class="deadline-slider-stops" aria-hidden="true">
              <span class="deadline-slider-stop">1 wk</span>
              <span class="deadline-slider-stop">2 wk</span>
              <span class="deadline-slider-stop">3 wk</span>
              <span class="deadline-slider-stop">1 mo</span>
              <span class="deadline-slider-stop">2 mo</span>
              <span class="deadline-slider-stop">3 mo</span>
            </div>
          </div>
          <div class="deadline-custom">
            <button class="link-button" id="pick-date-button" type="button">Pick a date</button>
            <input class="deadline-date-input" id="deadline-date-input" type="date" aria-label="Deadline date" hidden>
          </div>
        </div>
      </section>

      <p class="recommendation-result" id="recommendation-result"></p>
      <p class="recommendation-status" id="recommendation-status" aria-live="polite" hidden></p>

      <!-- watchlist-ui.js -->
      <div class="recommendation-actions">
        <button class="action-button action-button--buy" id="buy-now-button" type="button">Buy now</button>
        <button class="action-button action-button--watch" id="watch-button" type="button">Wait &amp; watch</button>
      </div>
      <p class="watch-confirmation" id="watch-confirmation" aria-live="polite" hidden></p>
      <p class="recommendation-best-price">
        Likely best price before your deadline:
        <strong class="recommendation-best-price-value" id="best-price-range"></strong>
      </p>

      <dl class="recommendation-details">
        <div class="recommendation-detail">
          <dt class="recommendation-detail-label">Expected savings</dt>
          <dd class="recommendation-detail-value" id="expected-savings"></dd>
        </div>
        <div class="recommendation-detail">
          <dt class="recommendation-detail-label">Confidence</dt>
          <dd class="recommendation-detail-value">
            <span class="confidence-badge" id="confidence"></span>
          </dd>
        </div>
        <div class="recommendation-detail" id="best-day-row">
          <dt class="recommendation-detail-label">Best day to buy</dt>
          <dd class="recommendation-detail-value" id="best-day"></dd>
        </div>
      </dl>

      <p class="recommendation-explanation" id="explanation"></p>
      <p class="data-source-label" id="data-source-label" hidden></p>
    </article>
  </main>

  <!-- Watched products (watchlist-ui.js). Shown on every screen when non-empty. -->
  <section class="watchlist" id="watchlist" aria-labelledby="watchlist-title" hidden>
    <h2 class="watchlist-title" id="watchlist-title">Watching</h2>
    <ul class="watchlist-items" id="watchlist-items"></ul>
  </section>

  <template id="watchlist-item-template">
    <li class="watchlist-item">
      <div class="watchlist-item-info">
        <a class="watchlist-item-title" target="_blank" rel="noopener"></a>
        <p class="watchlist-item-target"></p>
        <p class="watchlist-item-status" hidden></p>
      </div>
      <button class="watchlist-item-remove link-button" type="button">Remove</button>
    </li>
  </template>

  <!-- Only shown for unpacked (developer) installs; see popup.js. -->
  <details class="dev-panel" id="dev-panel" hidden>
    <summary class="dev-panel-summary">Dev tools</summary>
    <label class="dev-panel-field">
      <span class="dev-panel-label">Product</span>
      <select class="dev-panel-select" id="dev-detection">
        <option value="live">Live: ask the current tab</option>
        <option value="ok">Mock: product found</option>
        <option value="price_not_found">Mock: price not found</option>
        <option value="unavailable">Mock: item unavailable</option>
        <option value="not_product_page">Mock: not a product page</option>
        <option value="no_content_script">Mock: unsupported site</option>
        <option value="error">Mock: detection error</option>
      </select>
    </label>
    <label class="dev-panel-field">
      <span class="dev-panel-label">Data source</span>
      <select class="dev-panel-select" id="dev-source">
        <option value="backend">Backend (POST /predict)</option>
        <option value="mock">Mock (file below)</option>
      </select>
    </label>
    <label class="dev-panel-field">
      <span class="dev-panel-label">Mock file</span>
      <select class="dev-panel-select" id="dev-prediction">
        <option value="predict.json">predict.json</option>
        <option value="predict_wait.json">predict_wait.json</option>
        <option value="predict_buy_now.json">predict_buy_now.json</option>
        <option value="predict_low_confidence.json">predict_low_confidence.json</option>
        <option value="__loading">Never finishes (loading)</option>
        <option value="__error">Request fails (error)</option>
      </select>
    </label>
    <div class="dev-panel-group">
      <label class="dev-panel-field">
        <span class="dev-panel-label">Watched item</span>
        <select class="dev-panel-select" id="dev-watch"></select>
      </label>
      <div class="dev-panel-buttons">
        <button class="dev-panel-button" id="dev-simulate-drop" type="button">Simulate price drop</button>
        <button class="dev-panel-button" id="dev-simulate-deadline" type="button">Simulate deadline approaching</button>
      </div>
      <p class="dev-panel-status" id="dev-simulate-status" aria-live="polite"></p>
    </div>
  </details>

  <!-- MV3 blocks inline scripts. Order matters: each file may use the ones above it. -->
  <script src="../shared/config.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/dates.js"></script>
  <script src="../shared/watchlist.js"></script>
  <script src="api.js"></script>
  <script src="render.js"></script>
  <script src="sliders.js"></script>
  <script src="watchlist-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
