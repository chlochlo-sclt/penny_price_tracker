<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- penny app icon: a plain copper coin with a lowercase "p".
       Source for icon-32/48/128.png (icon-16.png uses penny-small.svg).
       Export: see "Icons" in the README. -->
  <defs>
    <radialGradient id="copper" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f0a56b"/>
      <stop offset="0.55" stop-color="#c8692e"/>
      <stop offset="1" stop-color="#9a4a1c"/>
    </radialGradient>
  </defs>

  <!-- coin body with a strong dark rim so it reads on light and dark toolbars -->
  <circle cx="64" cy="64" r="58" fill="url(#copper)" stroke="#5e2a0c" stroke-width="6"/>
  <!-- subtle inner rim -->
  <circle cx="64" cy="64" r="47" fill="none" stroke="#f6c39a" stroke-opacity="0.55" stroke-width="3"/>

  <!-- lowercase "p": a stem and a round bowl -->
  <g fill="none" stroke="#fff3e6" stroke-linecap="round" stroke-width="11">
    <line x1="52" y1="48" x2="52" y2="92"/>
    <circle cx="66" cy="60" r="14"/>
  </g>

  <!-- small shine, top left -->
  <path d="M30 46 A38 38 0 0 1 46 28" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
</svg>
